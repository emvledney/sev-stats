# Silverado Stats: the truck's upload route. Two pieces for /mnt/skpool/skunkworks/web-server/nginx.
#
# 1. In default.conf, next to the other upstreams (http level):

upstream sev_ingest {
    server 10.0.0.15:8790;
}
limit_req_zone $binary_remote_addr zone=sev:1m rate=2r/s;

# 2. In vl-development-nginx.conf, inside the `listen 4445 ssl` server for api.vl-development.com:

location /sev/v1/ {
    limit_req zone=sev burst=20 nodelay;
    limit_except GET POST { deny all; }
    client_max_body_size 1m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_pass http://sev_ingest/v1/;
}

# Only /sev/v1/ is routed, and only to the ingest container. The dashboard (port 8791) has no
# route here and must never get one.
