[project]
name = "ultium-probe"
version = "0.1.0"
description = "Read-only HV battery diagnostics for GM Ultium vehicles (Silverado EV)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ultium-probe = "ultium_probe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
