# Silverado EV (GM Ultium, BT1 platform) read-only DID profile.
#
# Every entry is a UDS 0x22 ReadDataByIdentifier in the default session.
# status:
#   confirmed         - checked on THIS truck (update after the first session)
#   community-ultium  - published from real Ultium vehicles (sources below)
#   unverified        - seen or plausible, but its meaning or scaling is not yet established
#
# Main sources (all public, read-only work by other owners):
#   S1 WiCAN #606  2024 Silverado EV Car Scanner log   https://github.com/meatpiHQ/wican-fw/issues/606
#   S2 WiCAN #587  2025 Sierra EV Car Scanner log      https://github.com/meatpiHQ/wican-fw/issues/587
#   S3 Hummer EV project (BT1 twin)                    https://github.com/JeremyWhittaker/hummer_obdII
#   S4 Equinox EV discovery (cell-group array)         https://github.com/Vedat-Ozkan/obd/blob/main/docs/discovery-2026-09.md
#   S5 OBDb Lyriq signalset / PR #14                   https://github.com/OBDb/Cadillac-LYRIQ/pull/14
#   S6 hacs_gm_ultium (BrightDrop)                     https://github.com/Coldarn/hacs_gm_ultium
#   S7 = this truck (2024 Silverado EV, 24 modules), session 1, 2026-11-03

[meta]
name = "silverado-ev"

# ecu + pri -> request 0x<pri>DA<ecu>F1, response 0x18DAF1<ecu> (pri 0x18) or 0x142AF1<ecu> (pri 0x14)
[modules.becm]
ecu = 0xCB
pri = 0x14
description = "Battery module, probably the K16 BECM ('BECM-B+EnergyCtrl' in the 09/0A census)"

[modules.dmcm]
ecu = 0x17
pri = 0x14
description = "Drive motor control module 1 (pack voltage and current)"

[modules.dmc2]
ecu = 0x1D
pri = 0x14
description = "Drive motor control module 2"

[modules.bcm]
ecu = 0x40
pri = 0x18
description = "Body control module (battery/coolant temperatures, charge pilot); answers only at priority 0x18"

[modules.gwm]
ecu = 0x45
pri = 0x18
description = "Gateway; answers OBD DTC reads 03/07/0A (used to bracket sessions)"

