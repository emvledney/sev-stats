# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Play package name (applicationId) of the app, already published on Play.
# IMPORTANT: never change it. A Play package name can never be changed or reused,
# and the Android Automotive OS form factor is bound to it. The Kotlin namespace
# (dev.silveradostats) is independent of this value.
silverado.applicationId=com.vincel.silveradoevstats
